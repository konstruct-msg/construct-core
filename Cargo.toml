[workspace]
members = [".", "store", "server-trust"]
resolver = "2"

[package]
name = "construct-core"
version = "0.56.0"
authors = ["Construct Team"]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/konstruct-msg/construct-core"
description = "Core cryptographic engine for Construct Messenger with E2EE"
keywords = ["crypto", "e2ee", "messaging", "x3dh", "double-ratchet"]
categories = ["cryptography"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
name = "construct_core"

[lints.rust]
unsafe_attr_outside_unsafe = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Feature flags
[features]
default = []
# Every platform build carries `post-quantum`. PQ is the product, not an option a build script
# may forget: a platform library without it negotiates CLASSIC with everyone, refuses no
# downgrade, and nothing in the app says so. Until 2026-09-25 the iOS/mac features left it to
# the build command (iOS release and Android CI passed it; CI's iOS/mac checks and the UniFFI
# test run did not, so the configuration that ships was not the one tested). `lib.rs` has a
# `compile_error!` for a platform feature without it, should this list ever lose it.
ios = ["uniffi", "dep:construct-store", "dep:construct-veil", "construct-veil?/tls", "construct-veil?/utls", "construct-veil?/webtunnel", "construct-veil?/coordinator", "dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential"]
# mac = same capabilities as ios — UniFFI Swift bindings + construct-veil TLS proxy
# Used when building libconstruct_core_mac.a for native macOS target
mac = ["uniffi", "dep:construct-store", "dep:construct-veil", "construct-veil?/tls", "construct-veil?/utls", "construct-veil?/webtunnel", "construct-veil?/coordinator", "dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential"]
# android = UniFFI JNI bindings (Kotlin) + construct-veil transport
android = ["uniffi", "dep:construct-store", "construct-store?/vendored-openssl", "dep:construct-veil", "construct-veil?/tls", "construct-veil?/utls", "construct-veil?/webtunnel", "construct-veil?/coordinator", "dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential"]
# ML-KEM and ML-DSA are unconditional since 0.56.0 (TODO 203): every build opens PQXDH v2 and
# suite-4 sessions, and there is no classical-only core to build. The feature stays as an empty
# alias for one release so `--features post-quantum` in scripts and docs keeps working.
post-quantum = []

[dependencies]
# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
rmp-serde = "1.1"

# Ошибки и утилиты
thiserror = "2"
tracing = "0.1"
hex = "0.4"
crc32fast = "1.3"

# Криптография
x25519-dalek = { version = "2.0", features = ["reusable_secrets", "static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["std", "rand_core"] }
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std", "getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
bip39 = { version = "2.0", features = ["rand"] }
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.0", features = ["zeroize_derive"] }

# Post-Quantum (optional) - ML-KEM and ML-DSA (NIST standardized names)
ml-kem = "0.3.0"
getrandom_pq = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
# RustCrypto `ml-dsa` (maintained) — replaced the archived PQClean-based
# pqcrypto-mldsa/pqcrypto-traits (RUSTSEC-2026-0162/0166). Seed-based secret-key
# storage; pins the SAME impl as construct-server for byte-level signature interop.
ml-dsa = "0.1.1"

# MLS (Messaging Layer Security) — group chat protocol (RFC 9420)
# Feature-gated: mls + group-conversation. Pulls in ~15 additional crates.
# NOTE: `test-utils` must NOT be enabled here — it is a dev-dependency activation
# (see [dev-dependencies]). It exposes unvalidated conversions such as
# `From<KeyPackageIn> for KeyPackage`, which is exactly what a shipped library
# must not be able to reach.
openmls = { version = "0.8", optional = true }
openmls_rust_crypto = { version = "0.5", optional = true }
openmls_basic_credential = { version = "0.5", optional = true }

# UniFFI runtime (optional). No `build` feature here: that feature is the bindings generator
# (uniffi_bindgen, goblin, weedle, toml), which only build.rs needs — see [build-dependencies].
# Until 2026-10-21 (TODO 206) it was enabled here too and compiled into the library itself: ~1.5 MB of text in
# libconstruct_core.a and five crates per platform build, dead-stripped from the app but not
# from the build. Resolver 2 keeps build-dependency features out of normal dependencies.
uniffi = { version = "0.30", optional = true }

# Traffic obfuscation — VEIL (obfs4 + WebTunnel pluggable transports)
#
# Pinned by commit, not `path = "../construct-veil"`. A path dependency made every build —
# default features included, since cargo reads optional manifests to resolve — fail without a
# sibling checkout, broke the README's own git-dependency quick start, and let a construct-core
# commit build against whatever construct-veil `main` happened to be when CI ran.
#
# Bump `rev` to take a veil change. To build against a local checkout while working on both,
# patch it outside this file (see README, "Working on construct-veil at the same time").
# The local store every client keeps — exported through this library's UDL on the platform
# features; the Tauri desktops and the TUI depend on it directly.
construct-store = { path = "store", optional = true }
# The bytes of a server signature, shared with construct-server and the root tool.
construct-server-trust = { path = "server-trust" }
construct-veil = { git = "https://github.com/konstruct-msg/construct-veil", rev = "c3330a45927fbe39c4661d0cfa45aecfff984eb8", features = ["ffi"], optional = true }

[dev-dependencies]
tempfile = "3"
# openmls `test-utils` lives here, not in [dependencies]: the MLS unit tests need
# SignatureKeyPair::private(), but the feature also unlocks unvalidated KeyPackage
# conversions that must stay unreachable from shipped code. resolver = "2" keeps
# dev-dependency features out of non-test builds, so `--features ios` gets a
# test-utils-free openmls.
openmls = { version = "0.8", features = ["test-utils"] }
openmls_basic_credential = { version = "0.5", features = ["test-utils"] }
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

# The offline root of the server keys — construct-docs manuals&instructions/server-root-key-ceremony.md
[[bin]]
name = "konstruct-root"

# Two devices in one process, no server: the core's event/action loop end to end (a reading aid).
[[example]]
name = "two_devices"

[[bench]]
name = "crypto_bench"
harness = false

[build-dependencies]
uniffi = { version = "0.30", features = ["build"] }

[package.metadata.uniffi.bindings]
swift = true


[profile.release]
opt-level = "z"     # optimize for binary size (vs speed)
lto = "thin"        # thin LTO: cross-crate dead-code strip without fat objects
codegen-units = 1   # single unit = better optimization (slower compile)
strip = "debuginfo" # strip DWARF debug info only; keep symbol table for C FFI exports
panic = "abort"     # no unwinding machinery (~10-15% smaller)

# Host-side build tooling — build scripts and proc-macro dylibs — is not what ships, and
# `strip` above corrupts it: since the 2026-09 toolchain, a stripped proc-macro dylib fails
# `dlopen` with "mis-aligned LINKEDIT string pool" and the crate that uses it (sqlx) cannot
# compile at all. This only turns the stripping off for artifacts that never leave the host.
[profile.release.build-override]
strip = false
