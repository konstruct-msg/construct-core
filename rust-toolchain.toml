# Pinned toolchain. Bump in lockstep with construct-veil's rust-toolchain.toml:
# construct-core compiles construct-veil (a git dependency pinned by `rev`) with
# this toolchain, so a veil change that needs a newer compiler needs it here too.
#
# `targets =` is listed here so `rustup` (and `rustup show`) auto-install the
# cross-compile std libs on first invocation — both locally and in CI. This
# is the single source of truth for which platforms construct-core supports.
#
# When bumping the channel: run
#   cargo clippy --all-targets -- -D warnings
#   cargo clippy --all-targets --features post-quantum -- -D warnings
# locally first to catch new-default lints before CI fails on them.

[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
