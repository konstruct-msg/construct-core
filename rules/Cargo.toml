[package]
name = "construct-rules"
version = "0.1.0"
authors = ["Construct Team"]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/konstruct-msg/construct-core"
description = "Client rules every Konstruct client applies the same way, written once: pure, sans-IO, no cryptography"

# Only `serde`: the rules own their state and its transitions, not a storage format. The core
# writes the state as a CFE envelope (`construct_core::rules_bindings`); a Rust client calls the
# same functions of the core it already depends on.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
